<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FF41;
            --secondary: #008F11;
            --accent: #00FFCC;
            --background: #0D0D0D;
            --soft-accent: #008F11;
            --text-dark: #00FF41;
            --page-bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', Consolas, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--page-bg);
            background-image: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* ── User Top Bar ── */
        .user-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0.6rem 1.5rem;
            background: rgba(13,13,13,0.9);
            border-bottom: 1px solid var(--primary);
            z-index: 100;
            gap: 0.75rem;
            box-shadow: 0 2px 8px rgba(0,255,65,0.1);
        }
        .user-bar .user-name {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .user-bar .user-avatar {
            width: 32px; height: 32px;
            border-radius: 2px;
            background: var(--background);
            border: 1px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 0 5px rgba(0,255,65,0.2);
        }
        .user-bar .logout-btn {
            background: var(--background);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.4rem 1rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .user-bar .logout-btn:hover {
            background: var(--primary);
            color: var(--page-bg);
            box-shadow: 0 0 10px rgba(0,255,65,0.3);
        }

        .container {
            text-align: center;
            padding: 3.5rem 3rem;
            background: rgba(13, 13, 13, 0.85);
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.15);
            border: 1px solid var(--primary);
            max-width: 800px;
            width: 90%;
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.15rem;
            font-weight: normal;
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        .cards {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: var(--background);
            border: 1px solid var(--secondary);
            border-radius: 2px;
            padding: 2.5rem 2rem;
            width: 260px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card::before {
            content: '>>';
            position: absolute;
            top: -10px; left: 10px;
            background: var(--background);
            padding: 0 5px;
            color: var(--primary);
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.2s;
            height: auto; width: auto;
        }

        .card:hover {
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2), inset 0 0 15px rgba(0, 255, 65, 0.1);
            border-color: var(--primary);
            transform: translateY(-4px);
        }

        .card:hover::before { opacity: 1; }
        .card:active { transform: translateY(0); }

        .card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: var(--page-bg);
            color: var(--primary);
            border: 1px solid var(--secondary);
            border-radius: 2px;
            margin-bottom: 1.25rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            border-color: var(--primary);
        }

        /* SVG Icons */
        .icon-svg {
            width: 36px;
            height: 36px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--secondary);
            opacity: 1;
            line-height: 1.5;
            font-weight: normal;
        }

        .peer-info {
            margin-top: 3.5rem;
            font-size: 0.9rem;
            color: var(--primary);
            display: inline-block;
            background: rgba(0, 143, 17, 0.1);
            border: 1px dashed var(--secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 2px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; box-shadow: 0 0 0 rgba(0, 255, 65, 0); }
            50% { opacity: 1; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
            100% { opacity: 0.8; box-shadow: 0 0 0 rgba(0, 255, 65, 0); }
        }
    </style>
</head>
<body>
    <!-- User Bar -->
    <div class="user-bar" id="userBar" style="display: none;">
        <div class="user-avatar" id="userAvatar"></div>
        <span class="user-name" id="userName"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <h1>P2P File Sharing</h1>
        <p class="subtitle">Select an operation to manage network files</p>

        <div class="cards">
            <a href="/upload" class="card upload">
                <div class="card-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <h2>Upload File</h2>
                <p>Segment and distribute a local file to the network infrastructure.</p>
            </a>

            <a href="/download" class="card download">
                <div class="card-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </div>
                <h2>Download File</h2>
                <p>Retrieve and assemble chunks from distributed network peers.</p>
            </a>
        </div>

        <p class="peer-info">Node Status: Connected to the P2P Swarm</p>
    </div>

    <script>
        async function loadUser() {
            try {
                const resp = await fetch('/api/auth/status');
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('userName').textContent = data.display_name || data.username;
                    document.getElementById('userAvatar').textContent = (data.display_name || data.username).charAt(0).toUpperCase();
                    document.getElementById('userBar').style.display = 'flex';
                }
            } catch(e) {}
        }
        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
        loadUser();
    </script>
</body>
</html>
