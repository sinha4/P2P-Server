<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File - P2P Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FF41;
            --secondary: #008F11;
            --accent: #00FFCC;
            --background: #0D0D0D;
            --soft-accent: #008F11;
            --text-dark: #00FF41;
            --page-bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', Consolas, monospace;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: var(--page-bg);
            background-image: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-dark);
            padding: 3rem 1rem;
            padding-top: 5rem;
            -webkit-font-smoothing: antialiased;
        }

        /* ── User Top Bar ── */
        .user-bar {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; align-items: center; justify-content: flex-end;
            padding: 0.6rem 1.5rem;
            background: rgba(13,13,13,0.9); border-bottom: 1px solid var(--primary);
            z-index: 100; gap: 0.75rem; box-shadow: 0 2px 8px rgba(0,255,65,0.1);
        }
        .user-bar .user-name { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
        .user-bar .user-avatar { 
            width: 32px; height: 32px; border-radius: 2px;
            background: var(--background); border: 1px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 0 5px rgba(0,255,65,0.2);
        }
        .user-bar .logout-btn {
            background: var(--background); color: var(--primary); border: 1px solid var(--primary);
            padding: 0.4rem 1rem; font-family: inherit; font-size: 0.8rem;
            font-weight: bold; border-radius: 2px; cursor: pointer; text-transform: uppercase;
        }
        .user-bar .logout-btn:hover { background: var(--primary); color: var(--page-bg); }

        .container {
            background: rgba(13, 13, 13, 0.85); border-radius: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.15); border: 1px solid var(--primary);
            padding: 3rem; width: 100%; max-width: 800px; margin: auto;
            backdrop-filter: blur(4px);
        }

        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: bold; color: var(--primary); letter-spacing: 0.05em; text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); text-transform: uppercase; text-align: center; }
        .subtitle { color: var(--secondary); font-size: 1.15rem; font-weight: normal; margin-bottom: 3rem; opacity: 0.9; text-align: center; }

        nav a { color: var(--secondary); text-decoration: none; font-weight: bold; font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover { color: var(--primary); text-shadow: 0 0 8px rgba(0,255,65,0.5); }

        .btn-refresh, .download-btn { background: var(--background); color: var(--primary); border: 1px solid var(--primary); padding: 1rem; font-size: 1.1rem; font-weight: bold; font-family: inherit; border-radius: 2px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .btn-refresh { padding: 0.75rem 1.5rem; font-size: 0.95rem; display: block; margin: 0 auto 1.5rem auto; }
        .download-btn { padding: 0.6rem 1.2rem; }
        .btn-refresh:hover, .download-btn:hover { background: rgba(0,255,65,0.1); box-shadow: 0 0 15px rgba(0,255,65,0.3); transform: translateY(-1px); }
        .download-btn:hover { background: var(--primary); color: var(--page-bg); }

        /* Download Specific */
        .file-card { background: var(--background); border: 1px solid var(--secondary); padding: 1.5rem; margin-bottom: 1rem; border-radius: 2px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;}
        .file-card:hover { border-color: var(--primary); background: rgba(0,255,65,0.05); transform: translateX(4px); box-shadow: -4px 0 0 var(--primary), 0 0 10px rgba(0,255,65,0.1); }
        .file-info strong { color: var(--primary); font-size: 1.15rem; display: block; margin-bottom: 0.25rem; font-weight: bold; }
        .file-info small { color: var(--secondary); font-size: 0.9rem; }
        
        #status { margin-top: 1.5rem; padding: 1rem; border-radius: 2px; font-weight: bold; text-align: center; display: none; }
        .status-loading { display: block!important; background: rgba(0,143,17,0.1); color: var(--accent); border: 1px solid var(--secondary); }
        .status-success { display: block!important; background: rgba(0,255,65,0.1); color: var(--primary); border: 1px solid var(--primary); }
        .status-error { display: block!important; background: rgba(255,0,0,0.1); color: #ff3333; border: 1px solid #ff3333; }

        #chunkDetails { margin-top: 2rem; background: rgba(0,0,0,0.5); border: 1px dashed var(--secondary); border-radius: 2px; padding: 1.5rem; display: none; }
        #chunkDetails.visible { display: block; }
        .dashboard-main-title { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.25rem; border-bottom: 1px solid var(--secondary); padding-bottom: 0.75rem; text-transform: uppercase; }
        .dashboard-section-title { color: var(--secondary); margin-bottom: 0.75rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: bold; }
        .peers-summary { margin-bottom: 1.5rem; }
        .peer-badge { display: inline-flex; padding: 0.25rem 0.6rem; border-radius: 2px; font-size: 0.8rem; font-weight: bold; margin-right: 0.5rem; margin-bottom: 0.5rem; border: 1px solid currentColor; background: rgba(0,0,0,0.5); align-items: center;}
        .chunk-grid { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 0.8rem; }
        .chunk-cell { width: 28px; height: 28px; border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; border: 1px solid rgba(0,0,0,0.5); position: relative; cursor: default; }
        .chunk-cell:hover { z-index: 2; border-color: white; box-shadow: 0 0 8px currentColor; transform: scale(1.1); }
        
        #loadBarInner { height: 16px; border: 1px solid var(--secondary); display: flex; background: var(--background); margin-top: 0.5rem; margin-bottom: 2rem; overflow: hidden; }
        .load-bar-segment { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; border-right: 1px solid rgba(0,0,0,0.3); transition: width 0.5s ease-out; }
        .load-bar-segment:last-child { border-right: none; }

        /* ── Video Modal ── */
        #videoModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #videoPlayer { max-width: 90%; max-height: 80vh; border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(0,255,65,0.2); background: #000; border-radius: 4px; }
        .video-controls { margin-top: 1.5rem; display: flex; gap: 1rem; }
        .stream-btn { background: var(--background); color: var(--accent); border: 1px solid var(--accent); padding: 0.6rem 1.2rem; font-size: 1.1rem; font-weight: bold; font-family: inherit; border-radius: 2px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .stream-btn:hover { background: var(--accent); color: var(--page-bg); box-shadow: 0 0 15px rgba(0,255,204,0.3); transform: translateY(-1px); }
        #endStreamBtn { border-color: #ff3333; color: #ff3333; }
        #endStreamBtn:hover { background: #ff3333; color: white; box-shadow: 0 0 15px rgba(255,51,51,0.3); }
        .stream-badge { position: absolute; top: 1.5rem; left: 1.5rem; color: var(--primary); font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; animation: blink 2s infinite; text-transform: uppercase; letter-spacing: 0.1em; }
        @keyframes blink { 0%, 100% { opacity: 1; text-shadow: 0 0 15px var(--primary); } 50% { opacity: 0.4; text-shadow: none; } }
    </style>
</head>
<body>
    <!-- User Bar -->
    <div class="user-bar" id="userBar" style="display: none;">
        <div class="user-avatar" id="userAvatar"></div>
        <span class="user-name" id="userName"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <nav><a href="/">← Return to Dashboard</a></nav>
        <h1>Download File</h1>
        <p class="subtitle">Retrieve and assemble files from the distributed network</p>

        <button class="btn-refresh" id="refreshBtn" onclick="browseFiles()">Refresh Network Files</button>
        <div id="fileList"></div>
        <div id="status"></div>

        <!-- Chunk source visualization -->
        <div id="chunkDetails">
            <h3 class="dashboard-main-title">Network Distribution Metrics</h3>
            <div id="peersSummary" class="peers-summary"></div>
            
            <h3 class="dashboard-section-title">Bandwidth Distribution Ratio</h3>
            <div id="loadBar" class="load-bar-container"></div>
            
            <h3 class="dashboard-section-title">Segment Assembly Map</h3>
            <div id="chunkGrid" class="chunk-grid"></div>
        </div>
    </div>

    <!-- Video Watch Party Modal -->
    <div id="videoModal">
        <div class="stream-badge">🔴 LIVE SYNC</div>
        <video id="videoPlayer" width="800"></video>
        <div class="video-controls">
            <button id="endStreamBtn" class="stream-btn" onclick="endStream()" style="display:none;">End Watch Party</button>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const fileListDiv = document.getElementById('fileList');
        const chunkDetailsDiv = document.getElementById('chunkDetails');

        // ── Watch Party WebSocket ──
        let ws;
        let isHost = false;
        
        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}/api/ws/remote`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.action === 'start') {
                    if (!isHost) openVideoModal(data.file_name, data.host_url, false);
                } else if (data.action === 'end') {
                    if (!isHost) closeVideoModal();
                }
            };
            ws.onclose = () => { setTimeout(connectWS, 2000); };
        }
        connectWS();

        function startStream(fileName, hostAddr) {
            isHost = true;
            const hostUrl = `http://${window.location.host}`;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'start', file_name: fileName, host_url: hostUrl }));
            }
            openVideoModal(fileName, hostUrl, true);
        }

        function endStream() {
            if (isHost && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'end' }));
            }
            closeVideoModal();
            isHost = false;
        }

        function openVideoModal(fileName, hostUrl, hostStatus) {
            const modal = document.getElementById('videoModal');
            const videoPlayer = document.getElementById('videoPlayer');
            const endBtn = document.getElementById('endStreamBtn');
            const badge = modal.querySelector('.stream-badge');

            videoPlayer.src = `${hostUrl}/api/stream/video?name=${encodeURIComponent(fileName)}`;
            if (hostStatus) {
                videoPlayer.controls = true;
                endBtn.style.display = 'block';
                badge.innerHTML = '🔴 HOSTING LIVE SYNC';
            } else {
                videoPlayer.controls = false; 
                endBtn.style.display = 'none';
                badge.innerHTML = '🔴 WATCHING LIVE SYNC';
            }
            modal.style.display = 'flex';
            videoPlayer.play().catch(e => console.log("Autoplay blocked:", e));
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.pause();
            videoPlayer.src = '';
            modal.style.display = 'none';
        }

        const PEER_COLORS = [
            '#00FF41', // Matrix Green
            '#00FFCC', // Cyan Accent
            '#008F11', // Darker Green
            '#00CC33', // Mid Green
            '#33FF66'

        ];

        function setStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = 'status-' + type;
        }

        async function browseFiles() {
            fileListDiv.innerHTML = '';
            chunkDetailsDiv.classList.remove('visible');
            setStatus('Scanning the network for available files...', 'loading');
            try {
                const resp = await fetch('/api/browse');
                if (!resp.ok) throw new Error(await resp.text());
                const files = await resp.json();
                statusDiv.style.display = 'none';

                if (!files || files.length === 0) {
                    fileListDiv.innerHTML = '<p style="text-align: center; color: var(--secondary); padding: 2rem; background: var(--page-bg); border-radius: 16px;">No files found in the network. Upload a file to populate the index.</p>';
                    return;
                }

                files.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    
                    let streamBtn = '';
                    if (f.file_name.toLowerCase().endsWith('.mp4')) {
                        streamBtn = `<button class="stream-btn" onclick="startStream('${f.file_name}', '${f.peer_address}')">Watch Party</button>`;
                    }

                    card.innerHTML = `
                        <div class="file-info">
                            <strong>${f.file_name}</strong>
                            <small>From: <strong>${f.peer_name}</strong> (${f.peer_address}) &bull; Size: ${formatSize(f.file_size)} &bull; Segments: ${f.total_chunks} &bull; Network Availability: ${f.peers_count} node(s)</small>
                        </div>
                        <div style="display:flex; gap: 0.75rem; align-items:center;">
                            ${streamBtn}
                            <button class="download-btn" onclick="downloadFile('${f.file_name}', '${f.peer_address}')">Retrieve</button>
                        </div>
                    `;
                    fileListDiv.appendChild(card);
                });
            } catch(err) {
                setStatus('Error: ' + err.message, 'error');
            }
        }

        async function downloadFile(name, peer) {
            chunkDetailsDiv.classList.remove('visible');
            setStatus(`Initiating download for "${name}"...`, 'loading');
            try {
                const resp = await fetch(`/api/download?name=${encodeURIComponent(name)}&peer=${encodeURIComponent(peer)}`);
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || JSON.stringify(data));

                if (data.status === 'success') {
                    setStatus(`Success: File "${data.file_name}" (${formatSize(data.file_size)}) retrieved and assembled at ${data.saved_to}`, 'success');
                    renderChunkDetails(data.chunk_sources, data.peers_used, data.peer_names);
                } else {
                    // Handle other statuses or errors if needed, though the !resp.ok check above should catch most
                    setStatus('Download failed: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch(err) {
                setStatus('Download failed: ' + err.message, 'error');
            }
        }

        function renderChunkDetails(chunkSources, peersUsed, peerNamesMap) {
            // Assign colors to peers
            const peerColorMap = {};
            peersUsed.forEach((p, i) => {
                peerColorMap[p] = PEER_COLORS[i % PEER_COLORS.length];
            });

            // Count chunks per peer
            const peerCounts = {};
            chunkSources.forEach(cs => {
                peerCounts[cs.peer_address] = (peerCounts[cs.peer_address] || 0) + 1;
            });
            const totalChunks = chunkSources.length;

            // Peers summary badges
            const summaryDiv = document.getElementById('peersSummary');
            summaryDiv.innerHTML = '<span style="color: var(--primary); font-size: 0.95rem; margin-right: 0.5rem; font-weight: 700;">Source Nodes:</span> ';
            peersUsed.forEach(p => {
                const count = peerCounts[p] || 0;
                const pct = ((count / totalChunks) * 100).toFixed(0);
                // Adjust text color if cell background relates to Golden Pollen or Evening Sky for better contrast
                const tColor = (peerColorMap[p] === '#F6C94D' || peerColorMap[p] === '#A7C7E4') ? 'var(--text-dark)' : 'white';
                const displayName = peerNamesMap ? (peerNamesMap[p] || p) : p;
                summaryDiv.innerHTML += `<span class="peer-badge" style="background:${peerColorMap[p]}; color: ${tColor}">${displayName} &bull; ${count} segments (${pct}%)</span> `;
            });

            // Load bar
            const loadBarDiv = document.getElementById('loadBar');
            loadBarDiv.innerHTML = '<div id="loadBarInner"></div>';
            const barInner = document.getElementById('loadBarInner');
            peersUsed.forEach(p => {
                const count = peerCounts[p] || 0;
                const pct = ((count / totalChunks) * 100).toFixed(1);
                const seg = document.createElement('div');
                seg.className = 'load-bar-segment';
                seg.style.width = pct + '%';
                seg.style.background = peerColorMap[p];
                seg.style.color = (peerColorMap[p] === '#F6C94D' || peerColorMap[p] === '#A7C7E4') ? 'var(--text-dark)' : 'white';
                seg.textContent = count > 0 ? count : '';
                const displayName = peerNamesMap ? (peerNamesMap[p] || p) : p;
                seg.title = `${displayName}: ${count} segments (${pct}%)`;
                barInner.appendChild(seg);
            });

            // Chunk grid — sort by index
            const sorted = [...chunkSources].sort((a, b) => a.chunk_index - b.chunk_index);
            const gridDiv = document.getElementById('chunkGrid');
            gridDiv.innerHTML = '';
            sorted.forEach(cs => {
                const cell = document.createElement('div');
                cell.className = 'chunk-cell';
                cell.style.background = peerColorMap[cs.peer_address];
                cell.style.color = (peerColorMap[cs.peer_address] === '#F6C94D' || peerColorMap[cs.peer_address] === '#A7C7E4') ? 'var(--text-dark)' : 'white';
                cell.textContent = cs.chunk_index;
                const displayName = peerNamesMap ? (peerNamesMap[cs.peer_address] || cs.peer_address) : cs.peer_address;
                cell.setAttribute('data-tooltip', `Index ${cs.chunk_index} — Node: ${displayName}`);
                gridDiv.appendChild(cell);
            });

            chunkDetailsDiv.classList.add('visible');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        // Auto-load on page open
        browseFiles();
    </script>
    <script>
        async function loadUser() {
            try {
                const resp = await fetch('/api/auth/status');
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('userName').textContent = data.display_name || data.username;
                    document.getElementById('userAvatar').textContent = (data.display_name || data.username).charAt(0).toUpperCase();
                    document.getElementById('userBar').style.display = 'flex';
                }
            } catch(e) {}
        }
        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
        loadUser();
    </script>
</body>
</html>
